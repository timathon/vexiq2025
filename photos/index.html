<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Album</title>
    <style>
        @page {
            size: A4;
            margin: 10mm;
        }
        body {
            font-family: sans-serif;
            /* background-color: #f0f0f0; */
            margin: 0;
        }
        .sheet {
            background: white;
            display: block;
            margin: 0 auto;
            margin-bottom: 0.5cm;
            box-shadow: 0 0 0.5cm rgba(0,0,0,0.5);
            width: 210mm;
            height: 297mm;
            padding: 1cm;
            box-sizing: border-box;
            page-break-after: always;
        }
        .photo-grid {
            column-count: 2;
            column-gap: 10px;
        }
        .photo-grid .photo {
            width: 100%;
            height: auto;
            display: block;
            margin-bottom: 10px;
            /* border: 1px solid #ccc; */
            page-break-inside: avoid; /* Prevent image from breaking across pages */
        }
        .photo-grid .photo-tall {
            height: 500px;
            object-fit: contain;
        }
        .logo-page {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            height: 100%;
        }
        .logo-row {
            display: flex;
            justify-content: space-around;
        }
        .logo-row img {
            width: 20%;
            height: auto;
            border: 1px solid #eee;
        }
    </style>
</head>
