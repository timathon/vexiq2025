<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Collage</title>
    <style>
        @page {
            size: A4;
            margin: 10mm;
        }
        body {
            font-family: sans-serif;
            background-color: #f0f0f0;
            margin: 0;
        }
        .sheet {
            background: white;
            display: block;
            margin: 0 auto;
            margin-bottom: 0.5cm;
            box-shadow: 0 0 0.5cm rgba(0,0,0,0.5);
            width: 210mm;
            height: 297mm;
            padding: 1cm;
            box-sizing: border-box;
            page-break-after: always;
        }
        .collage-grid {
            column-count: 3;
            column-gap: 15px;
        }
        .collage-grid .photo {
            width: 100%;
            height: auto;
            display: block;
            margin-bottom: 15px;
            box-shadow: 3px 3px 7px rgba(0,0,0,0.3);
            transition: all 0.2s ease-in-out;
        }
        .collage-grid .photo:hover {
            transform: scale(1.05) !important;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
        }
        .rotate-left {
            transform: rotate(-4deg);
        }
        .rotate-right {
            transform: rotate(4deg);
        }
        .photo-big {
            column-span: all;
        }
    </style>
</head>
<body>
    <div class="sheet">
        <div class="collage-grid">
            <img class="photo photo-big" src="big-0.jpg" alt="big-0">
            <img class="photo rotate-left" src="02750e9a610d0b5bd8837ea221fcb01f.jpg" alt="photo">
