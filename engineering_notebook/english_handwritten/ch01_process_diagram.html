<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Season Development Flowchart</title>
    <style>
        :root {
            --primary-color: #2563eb; /* Blue */
            --accent-color: #f59e0b;  /* Orange for iteration */
            --bg-color: #f8fafc;
            --box-bg: #ffffff;
            --text-color: #1e293b;
            --node-width: 240px; 
        }

        body {
            font-family: 'Patrick Hand', cursive;
            display: flex;
            justify-content: center;
            padding: 15px;
        }

        .flowchart-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
            position: relative;
        }

        .node {
            background-color: var(--box-bg);
            border: 2px solid var(--primary-color);
            color: var(--text-color);
            padding: 10px 20px; 
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 2;
            width: var(--node-width);
            text-align: center;
            transition: transform 0.2s;
        }

        .node:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .arrow {
            font-size: 24px;
            color: var(--primary-color);
            margin: 5px 0;
            font-weight: bold;
            line-height: 1;
        }

        .loop-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative; 
            width: 100%;
        }

        .feedback-line {
            position: absolute;
            left: 50%; 
            margin-left: 185px; 
            top: 30px; 
            bottom: 30px; 
            width: 40px;
            border-right: 3px dashed var(--accent-color);
            border-top: 3px dashed var(--accent-color);
            border-bottom: 3px dashed var(--accent-color);
            border-top-right-radius: 15px;
            border-bottom-right-radius: 15px;
            z-index: 1;
            pointer-events: none;
        }

        .feedback-label {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translate(50%, -50%);
            background-color: white;
            color: var(--accent-color);
            writing-mode: vertical-rl;
            text-orientation: mixed;
            letter-spacing: 5px;
            border: 2px solid var(--accent-color);
            padding: 10px 8px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            white-space: nowrap;
        }

        .feedback-line::after {
            content: '◄'; 
            position: absolute;
            top: -11px;
            left: -12px;
            color: var(--accent-color);
            font-size: 14px;
        }

        .node.highlight {
            border-color: var(--accent-color);
        }

    </style>
</head>
<body>

    <div class="flowchart-container">
        <!-- Preparation Phase -->
        <div class="node">Learn & Digest Rules</div>
        <div class="arrow">↓</div>
        
        <div class="node">Brainstorming</div>
        <div class="arrow">↓</div>
        
        <div class="node">Set Strategy & Choose Plans</div>
        <div class="arrow">↓</div>

        <!-- Loop Phase -->
        <div class="loop-section">
            <!-- The Feedback Line -->
            <div class="feedback-line">
                <div class="feedback-label">Iteration & Optimization</div>
            </div>

            <!-- Start of Loop -->
            <div class="node highlight">Build & Debug Robot</div>
            <div class="arrow">↓</div>

            <div class="node">Write & Debug Code</div>
            <div class="arrow">↓</div>

            <div class="node">Training & Teamwork</div>
            <div class="arrow">↓</div>

            <div class="node">Participate in Matches</div>
            <div class="arrow">↓</div>
            
            <div class="node">Find Problems</div>
            <div class="arrow">↓</div>

            <!-- End of Loop -->
            <div class="node highlight">Improve Robot</div>
        </div>
    </div>

</body>
</html>
